# The local services use separate PostgreSQL databases in one container. Each
# database has its own credentials and Flyway history. Invoke this file through
# `just` (or with --env-file .env.local) so a sibling checkout's published port
# is not reused.
services:
  caddy:
    image: caddy:2-alpine
    environment:
      HEIDI_PUBLIC_HOST: ${HEIDI_PUBLIC_HOST:-https://localhost}
      HEIDI_PLATFORM_PORT: ${HEIDI_PLATFORM_PORT:-8080}
      HEIDI_ISSUER_PORT: ${HEIDI_ISSUER_PORT:-8082}
      HEIDI_VERIFIER_PORT: ${HEIDI_VERIFIER_PORT:-8083}
      HEIDI_WEB_PORT: ${HEIDI_WEB_PORT:-5173}
    ports:
      - "${HEIDI_HTTPS_PORT:-8443}:443"
      - "${HEIDI_CA_PORT:-80}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./local/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.local/caddy/data:/data
      - ./.local/caddy/config:/config

  platform-postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${PLATFORM_POSTGRES_DB:-heidi_platform_api}
      POSTGRES_USER: ${PLATFORM_POSTGRES_USER:-heidi_platform_api}
      POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD:-heidi_platform_api}
      SIGNING_POSTGRES_DB: ${SIGNING_POSTGRES_DB:-heidi_signing}
      SIGNING_POSTGRES_USER: ${SIGNING_POSTGRES_USER:-heidi_signing}
      SIGNING_POSTGRES_PASSWORD: ${SIGNING_POSTGRES_PASSWORD:-heidi_signing}
      ISSUER_POSTGRES_DB: ${ISSUER_POSTGRES_DB:-heidi_issuer}
      ISSUER_POSTGRES_USER: ${ISSUER_POSTGRES_USER:-heidi_issuer}
      ISSUER_POSTGRES_PASSWORD: ${ISSUER_POSTGRES_PASSWORD:-heidi_issuer}
      VERIFIER_POSTGRES_DB: ${VERIFIER_POSTGRES_DB:-heidi_verifier}
      VERIFIER_POSTGRES_USER: ${VERIFIER_POSTGRES_USER:-heidi_verifier}
      VERIFIER_POSTGRES_PASSWORD: ${VERIFIER_POSTGRES_PASSWORD:-heidi_verifier}
    ports:
      - "${PLATFORM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - platform_postgres_data:/var/lib/postgresql
      - ./tools/postgres/10-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  platform_postgres_data:
