server.port=${HEIDI_SIGNING_PORT:8086}
spring.application.name=heidi-software-signing
spring.mvc.problemdetails.enabled=true

# The reference service is in-memory unless database storage is explicitly enabled. The
# datasource auto-configuration is disabled so a normal local/test launch does not need DB
# settings; SigningServiceApplication creates the datasource only in database mode.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
spring.flyway.enabled=${heidi.signing.software.database.enabled:false}
spring.flyway.locations=classpath:/db/migration
spring.flyway.table=heidi_signing_flyway_schema_history
# SPRING_DATASOURCE_* from a Secret of its own, the same convention the other
# services follow. Empty rather than required, unlike theirs, because this
# service starts with no database at all unless the flag above is set; the
# local profile fills them in for development.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

logging.config=classpath:logback-spring.xml
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Authentication is fail-closed by default. Local development selects the explicit `local` profile,
# which sets this to `none`; production must configure bearer, mTLS or registered-key authentication.
heidi.signing.auth.mode=${HEIDI_SIGNING_AUTH_MODE:bearer}
heidi.signing.auth.bearer-token=${HEIDI_SIGNING_BEARER_TOKEN:}
heidi.signing.auth.client=${HEIDI_SIGNING_AUTH_CLIENT:}
heidi.signing.auth.fail-open=${HEIDI_SIGNING_AUTH_FAIL_OPEN:false}
heidi.signing.auth.timestamp-window=${HEIDI_SIGNING_AUTH_TIMESTAMP_WINDOW:60s}
heidi.signing.provider-scheme=${HEIDI_SIGNING_SCHEME:software}
heidi.signing.software.database.enabled=${HEIDI_SIGNING_SOFTWARE_DATABASE_ENABLED:false}
heidi.signing.software.database.encryption-master-key=${HEIDI_SIGNING_ENCRYPTION_MASTER_KEY:}

# Optional bootstrap software key. Mount the PKCS#12 read-only (for example from a Kubernetes
# Secret) and provide its password through a Secret-backed environment variable. The key is
# imported and persisted only when the configured database store is empty; otherwise persisted
# keys take precedence. With no alias/key-id, the file must contain exactly one private-key entry
# and its alias becomes the software:// key ID. The algorithm is required, especially for RSA
# (RS* vs PS*).
heidi.signing.software.pkcs12.path=${HEIDI_SIGNING_SOFTWARE_PKCS12_PATH:}
heidi.signing.software.pkcs12.password=${HEIDI_SIGNING_SOFTWARE_PKCS12_PASSWORD:}
heidi.signing.software.pkcs12.alias=${HEIDI_SIGNING_SOFTWARE_PKCS12_ALIAS:}
heidi.signing.software.pkcs12.key-id=${HEIDI_SIGNING_SOFTWARE_PKCS12_KEY_ID:}
heidi.signing.software.pkcs12.algorithm=${HEIDI_SIGNING_SOFTWARE_PKCS12_ALGORITHM:}

logbook.format.style=splunk
logbook.filter.form-request-mode=parameter
logbook.strategy=body-only-if-status-at-least
logbook.write.status-code-based=true
logbook.obfuscate.headers=Authorization,Signing-Authentication,Signing-Authentication-Timestamp,Signing-Authentication-Purpose,Signing-Authentication-Signature,Signing-Authentication-Key-Id,Content-Security-Policy,Set-Cookie,Permissions-Policy
logbook.obfuscate.parameters=access_token,client_secret,jwt_token
logbook.obfuscate.json-body-fields=privateJwk,privateKey,privateKeyPassword,bearerToken
