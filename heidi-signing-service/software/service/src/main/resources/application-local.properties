# The local profile imports the repository's .env.local, matching the other
# backend services so IDE launches inherit the same ports and signer settings.
spring.config.import=optional:file:../../../.env.local[.properties]

heidi.signing.auth.mode=${HEIDI_SIGNING_AUTH_MODE:none}
heidi.signing.auth.fail-open=${HEIDI_SIGNING_AUTH_FAIL_OPEN:true}

# The dedicated signing database in the compose Postgres, spelled out here the
# way the other services spell out theirs. application.properties carries no
# fallback, so this is what a local run in database mode connects to.
spring.datasource.url=jdbc:postgresql://localhost:${PLATFORM_POSTGRES_PORT:5432}/${SIGNING_POSTGRES_DB:heidi_signing}
spring.datasource.username=${SIGNING_POSTGRES_USER:heidi_signing}
spring.datasource.password=${SIGNING_POSTGRES_PASSWORD:heidi_signing}

logbook.format.style=http
logbook.strategy=status-at-least
logbook.minimum-status=400
logbook.write.status-code-based=true
heidi.signing.software.database.enabled=${HEIDI_SIGNING_SOFTWARE_DATABASE_ENABLED:true}
