name: Install native signing artifacts
description: >
  Installs the signer interface and PKI JVM artifacts staged by the
  build-signer-interface action into the runner's local Maven repository. These
  artifacts are not published to a remote repository, so Maven reactors that
  depend on them need this before they can resolve their dependencies.

inputs:
  artifact-name:
    description: Name of the artifact uploaded by build-signer-interface.
    required: false
    default: native-signing-m2

runs:
  using: composite
  steps:
    - name: Download native signing artifacts
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact-name }}
        path: signer-m2

    - name: Install into Maven Local
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/.m2repo/org"
        cp -r signer-m2/heidiverse "$GITHUB_WORKSPACE/.m2repo/org/"
        test -s "$GITHUB_WORKSPACE/.m2repo/org/heidiverse/heidi-pki-x509-jvm/0.1.0/heidi-pki-x509-jvm-0.1.0.jar"
        test -s "$GITHUB_WORKSPACE/.m2repo/org/heidiverse/heidi-pki-x509-jvm/0.1.0/heidi-pki-x509-jvm-0.1.0.pom"
