# The local profile imports the repository's .env.local, which is a valid
# .properties file, so IDE run configurations and `just` share one definition of
# HEIDI_PUBLIC_HOST. The path is relative to this module's working directory and
# optional, so a run started from elsewhere still boots on the defaults below.
spring.config.import=optional:file:../../../.env.local[.properties]

# Ports for this checkout's stack. Overriding them in .env.local moves the
# service and every URL below with it, so a second checkout can run its own.
server.port=${HEIDI_VERIFIER_PORT:8083}

# Points at the root compose.yaml so an IDE run can manage the databases itself
# by setting spring.docker.compose.enabled=true. The just recipes start them
# with `just dev-db` instead, so the integration stays off by default.
spring.docker.compose.file=../../../compose.yaml
spring.docker.compose.enabled=false
spring.devtools.livereload.port=35731
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
logging.level.org.springdoc.core.events.SpringDocAppInitializer=ERROR
logbook.format.style=http
logbook.strategy=status-at-least
logbook.minimum-status=400
logbook.write.status-code-based=true
spring.datasource.url=jdbc:postgresql://localhost:${PLATFORM_POSTGRES_PORT:5432}/${VERIFIER_POSTGRES_DB:heidi_verifier}
spring.datasource.username=${VERIFIER_POSTGRES_USER:heidi_verifier}
spring.datasource.password=${VERIFIER_POSTGRES_PASSWORD:heidi_verifier}

heidi.verifier.public-base-url=${HEIDI_VERIFIER_PUBLIC_BASE_URL:${HEIDI_PUBLIC_HOST:https://localhost}:${HEIDI_HTTPS_PORT:8443}/presentation}
heidi.verifier.platform-internal-base-url=${HEIDI_VERIFIER_PLATFORM_INTERNAL_BASE_URL:${HEIDI_ENTITY_BASE_URL:http://127.0.0.1:${HEIDI_PLATFORM_PORT:8080}}}
heidi.verifier.platform-basic-auth=${HEIDI_PLATFORM_BASIC_AUTH:YXBpOjEyMzQ1}
heidi.verifier.signing-provider.base-url=${HEIDI_VERIFIER_SIGNING_PROVIDER_BASE_URL:${HEIDI_SIGNING_BASE_URL:http://127.0.0.1:${HEIDI_SIGNING_PORT:8086}}}
heidi.verifier.signing-provider.authentication-mode=${HEIDI_VERIFIER_SIGNING_PROVIDER_AUTHENTICATION_MODE:${HEIDI_SIGNING_AUTH_MODE:none}}
heidi.verifier.signing-provider.client-seed=${HEIDI_VERIFIER_SIGNING_PROVIDER_CLIENT_SEED:${HEIDI_VERIFIER_SIGNING_CLIENT_SEED:}}
heidi.verifier.web-base-url=${HEIDI_VERIFIER_WEB_BASE_URL:${HEIDI_WEB_BASE_URL:${HEIDI_PUBLIC_HOST:https://localhost}:${HEIDI_HTTPS_PORT:8443}}}
heidi.verifier.oid4vp.dc-api.expected-origins=${HEIDI_VERIFIER_OID4VP_DC_API_EXPECTED_ORIGINS:${HEIDI_PUBLIC_BASE_URL:${HEIDI_PUBLIC_HOST:https://localhost}:${HEIDI_HTTPS_PORT:8443}}}




heidi.verifier.session.encryption-master-key=${HEIDI_VERIFIER_SESSION_ENCRYPTION_MASTER_KEY:db1e2bed09d75e6499a58f3733e02f92aec57ca0166f6e4b1513a5f438f7443f}
