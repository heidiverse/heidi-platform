server.port=${SERVER_PORT:8083}
spring.application.name=heidi-verifier
spring.mvc.problemdetails.enabled=true

spring.jpa.open-in-view=false

# Monitoring and Kubernetes probes. Keep the exposed actuator surface explicit;
# health details are intentionally not returned to unauthenticated callers.
management.server.port=${HEIDI_VERIFIER_MANAGEMENT_PORT:8085}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

logging.config=classpath:logback-spring.xml
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Swagger UI properties (See: https://springdoc.org/#swagger-ui-properties)
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=false
springdoc.swagger-ui.path=/api-docs/swagger-ui
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.defaultModelsExpandDepth=2
springdoc.swagger-ui.syntaxHighlight.theme=arta

# Database
spring.datasource.hikari.max-lifetime=600000
spring.flyway.locations=classpath:/db/migration/{vendor}

# Wallet-facing verifier URL. This must be reachable by wallets and is separate
# from internal Kubernetes service URLs.
heidi.verifier.public-base-url=${HEIDI_VERIFIER_PUBLIC_BASE_URL}
heidi.verifier.oid4vp.wallet.response-base-url=${heidi.verifier.public-base-url}

heidi.verifier.oid4vp.request-lifetime=PT10M
heidi.verifier.oid4vp.request-cleanup=PT5M
heidi.verifier.oid4vp.kb-jwt-max-validity-period=PT10M

# Credential types that are defined without an expiration claim. Empty by default:
# every credential must carry `exp` unless a deployment opts a type out here, and
# the exemption then applies to every issuer the verifier trusts.
heidi.verifier.oid4vp.vct-without-expiry=${HEIDI_VERIFIER_OID4VP_VCT_WITHOUT_EXPIRY:${OID4VP_VERIFIER_VCT_WITHOUT_EXPIRY:}}

# properties to easily modify behavior without fully re-deploying
heidi.verifier.oid4vp.verify-issuer-signature=true
heidi.verifier.oid4vp.verify-device-signature=true




# 32-byte hex key used only to protect per-request response private keys in the verifier session.
heidi.verifier.session.encryption-master-key=${HEIDI_VERIFIER_SESSION_ENCRYPTION_MASTER_KEY}

# predefined JWK sets to be used for credential signature verification in cases where regular web key resolution doesn't work
heidi.verifier.oid4vp.predefined-jwks=${HEIDI_VERIFIER_OID4VP_PREDEFINED_JWKS:${OID4VP_VERIFIER_PREDEFINED_JWKS:{}}}


heidi.verifier.platform-internal-base-url=${HEIDI_VERIFIER_PLATFORM_INTERNAL_BASE_URL:${HEIDI_ENTITY_BASE_URL}}
heidi.verifier.platform-basic-auth=${HEIDI_PLATFORM_BASIC_AUTH:}
heidi.verifier.signing-provider.base-url=${HEIDI_VERIFIER_SIGNING_PROVIDER_BASE_URL:${HEIDI_SIGNING_BASE_URL:}}
heidi.verifier.signing-provider.authentication-mode=${HEIDI_VERIFIER_SIGNING_PROVIDER_AUTHENTICATION_MODE:${HEIDI_SIGNING_AUTH_MODE:}}
heidi.verifier.signing-provider.client-seed=${HEIDI_VERIFIER_SIGNING_PROVIDER_CLIENT_SEED:${HEIDI_VERIFIER_SIGNING_CLIENT_SEED:}}
heidi.verifier.web-base-url=${HEIDI_VERIFIER_WEB_BASE_URL:${HEIDI_WEB_BASE_URL}}
heidi.verifier.oid4vp.dc-api.expected-origins=${HEIDI_VERIFIER_OID4VP_DC_API_EXPECTED_ORIGINS:${OID4VP_DC_API_EXPECTED_ORIGINS}}


logbook.format.style=splunk
logbook.filter.form-request-mode=parameter
logbook.strategy=body-only-if-status-at-least
logbook.write.status-code-based=true
logbook.obfuscate.headers=Authorization,Content-Security-Policy,Set-Cookie,Permissions-Policy
logbook.obfuscate.parameters=access_token,client_secret,jwt_token,vp_token
logbook.obfuscate.json-body-fields=access_token,client_secret,jwt_token,vp_token
