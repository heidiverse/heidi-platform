spring.application.name=heidi-issuer
spring.profiles.active=local
spring.mvc.problemdetails.enabled=true
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
server.port=${SERVER_PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Wallet-facing issuer URL. This must be reachable by wallets and is separate
# from the internal platform service URL below.
heidi.issuer.public-base-url=${HEIDI_ISSUER_PUBLIC_BASE_URL}
heidi.issuer.public-url=${heidi.issuer.public-base-url}
heidi.issuer.api-key=${HEIDI_ISSUER_API_KEY}
heidi.issuer.platform-internal-base-url=${HEIDI_ISSUER_PLATFORM_INTERNAL_BASE_URL:${HEIDI_PLATFORM_BASE_URL}}
heidi.issuer.platform-public-base-url=${HEIDI_PLATFORM_PUBLIC_BASE_URL:}
heidi.issuer.platform-basic-auth=${HEIDI_PLATFORM_BASIC_AUTH}
heidi.issuer.credential-request-encryption-required=${HEIDI_ISSUER_CREDENTIAL_REQUEST_ENCRYPTION_REQUIRED:false}
heidi.issuer.credential-response-encryption-required=${HEIDI_ISSUER_CREDENTIAL_RESPONSE_ENCRYPTION_REQUIRED:false}
heidi.issuer.credential-lifetime-seconds=${HEIDI_ISSUER_CREDENTIAL_LIFETIME_SECONDS:1209600}
heidi.issuer.access-token-lifetime-seconds=${HEIDI_ISSUER_ACCESS_TOKEN_LIFETIME_SECONDS:600}
heidi.issuer.refresh-token-lifetime-seconds=${HEIDI_ISSUER_REFRESH_TOKEN_LIFETIME_SECONDS:2592000}
heidi.issuer.dpop-proof-max-age-seconds=${HEIDI_ISSUER_DPOP_PROOF_MAX_AGE_SECONDS:300}
heidi.issuer.dpop-nonce-lifetime-seconds=${HEIDI_ISSUER_DPOP_NONCE_LIFETIME_SECONDS:300}
heidi.issuer.dpop-nonce-key=${HEIDI_ISSUER_DPOP_NONCE_KEY:}

# Retains the former issuer's DISABLED / OPTIONAL / REQUIRED feature policy.
heidi.issuer.enforcement.dpop=${HEIDI_ISSUER_ENFORCEMENT_DPOP:REQUIRED}
heidi.issuer.enforcement.status-list=${HEIDI_ISSUER_ENFORCEMENT_STATUS_LIST:OPTIONAL}
heidi.issuer.enforcement.tx-code=${HEIDI_ISSUER_ENFORCEMENT_TX_CODE:OPTIONAL}
heidi.issuer.enforcement.client-attestation=${HEIDI_ISSUER_ENFORCEMENT_CLIENT_ATTESTATION:OPTIONAL}
heidi.issuer.session.encryption-master-key=${HEIDI_ISSUER_SESSION_ENCRYPTION_MASTER_KEY}
heidi.issuer.transaction-code-master-key=${HEIDI_ISSUER_TRANSACTION_CODE_MASTER_KEY:${HEIDI_TRANSACTION_CODE_MASTER_KEY:}}

heidi.issuer.signing-provider.base-url=${HEIDI_ISSUER_SIGNING_PROVIDER_BASE_URL:${HEIDI_SIGNING_BASE_URL:}}
heidi.issuer.signing-provider.authentication-mode=${HEIDI_ISSUER_SIGNING_PROVIDER_AUTHENTICATION_MODE:${HEIDI_SIGNING_AUTH_MODE:}}
heidi.issuer.signing-provider.client-seed=${HEIDI_ISSUER_SIGNING_PROVIDER_CLIENT_SEED:${HEIDI_ISSUER_SIGNING_CLIENT_SEED:}}

management.server.port=${HEIDI_ISSUER_MANAGEMENT_PORT:8084}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
springdoc.swagger-ui.path=/api-docs/swagger-ui/index.html
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=false

logbook.format.style=splunk
logbook.strategy=body-only-if-status-at-least
logbook.write.status-code-based=true
logbook.filter.form-request-mode=parameter
logbook.obfuscate.headers=Authorization,Content-Security-Policy,Set-Cookie,Permissions-Policy
logbook.obfuscate.parameters=access_token,client_secret,jwt_token
logbook.obfuscate.json-body-fields=access_token,client_secret,jwt_token,encryptedPayload
