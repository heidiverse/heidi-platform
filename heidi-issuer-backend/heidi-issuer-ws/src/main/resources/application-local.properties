# The local profile imports the repository's .env.local, which is a valid
# .properties file, so IDE run configurations and `just` share one definition of
# HEIDI_PUBLIC_HOST. The path is relative to this module's working directory and
# optional, so a run started from elsewhere still boots on the defaults below.
spring.config.import=optional:file:../../.env.local[.properties]

# Ports for this checkout's stack. Overriding them in .env.local moves the
# service and every URL below with it, so a second checkout can run its own.
server.port=${HEIDI_ISSUER_PORT:8082}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
logging.level.org.springdoc.core.events.SpringDocAppInitializer=ERROR
logbook.format.style=http
logbook.strategy=status-at-least
logbook.minimum-status=400
logbook.write.status-code-based=true

spring.datasource.url=jdbc:postgresql://localhost:${PLATFORM_POSTGRES_PORT:5432}/${ISSUER_POSTGRES_DB:heidi_issuer}
spring.datasource.username=${ISSUER_POSTGRES_USER:heidi_issuer}
spring.datasource.password=${ISSUER_POSTGRES_PASSWORD:heidi_issuer}

heidi.issuer.public-base-url=${HEIDI_ISSUER_PUBLIC_BASE_URL:${HEIDI_PUBLIC_HOST:https://localhost}:${HEIDI_HTTPS_PORT:8443}/issuance}
heidi.issuer.api-key=${HEIDI_ISSUER_API_KEY:local-development-api-key}
heidi.issuer.platform-internal-base-url=${HEIDI_ISSUER_PLATFORM_INTERNAL_BASE_URL:${HEIDI_PLATFORM_BASE_URL:http://127.0.0.1:${HEIDI_PLATFORM_PORT:8080}}}
heidi.issuer.platform-public-base-url=${HEIDI_PLATFORM_PUBLIC_BASE_URL:${HEIDI_PUBLIC_HOST:https://localhost}:${HEIDI_HTTPS_PORT:8443}}
heidi.issuer.platform-basic-auth=${HEIDI_PLATFORM_BASIC_AUTH:YXBpOjEyMzQ1}
# Local-only key matching the coordinator.
heidi.issuer.transaction-code-master-key=${HEIDI_ISSUER_TRANSACTION_CODE_MASTER_KEY:${HEIDI_TRANSACTION_CODE_MASTER_KEY:4afa8db01ec9fa40a852332b0f6bcbf709c749e102d71d789af3876e72d925d2}}
heidi.issuer.credential-request-encryption-required=${HEIDI_ISSUER_CREDENTIAL_REQUEST_ENCRYPTION_REQUIRED:false}
heidi.issuer.credential-response-encryption-required=${HEIDI_ISSUER_CREDENTIAL_RESPONSE_ENCRYPTION_REQUIRED:false}
heidi.issuer.session.encryption-master-key=${HEIDI_ISSUER_SESSION_ENCRYPTION_MASTER_KEY:db1e2bed09d75e6499a58f3733e02f92aec57ca0166f6e4b1513a5f438f7443f}

heidi.issuer.signing-provider.base-url=${HEIDI_ISSUER_SIGNING_PROVIDER_BASE_URL:${HEIDI_SIGNING_BASE_URL:http://127.0.0.1:${HEIDI_SIGNING_PORT:8086}}}
heidi.issuer.signing-provider.authentication-mode=${HEIDI_ISSUER_SIGNING_PROVIDER_AUTHENTICATION_MODE:${HEIDI_SIGNING_AUTH_MODE:none}}
heidi.issuer.signing-provider.client-seed=${HEIDI_ISSUER_SIGNING_PROVIDER_CLIENT_SEED:${HEIDI_ISSUER_SIGNING_CLIENT_SEED:}}
