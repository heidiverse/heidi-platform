server.port=${SERVER_PORT:8080}

spring.application.name=heidi-platform-api
spring.mvc.problemdetails.enabled=true

# External JWT claim containing the Heidi tenant identifier. It is normalized to the
# internal companyId claim at the resource-server boundary for backward compatibility.
heidi.platform.security.tenant-claim=${HEIDI_PLATFORM_SECURITY_TENANT_CLAIM:companyId}

# Public wallet catalog used as the platform default when an organisation has no override.
# Self-hosted installations can point this at their own compatible catalog or set the
# environment variable to an empty value to disable the import.
heidi.platform.wallet-catalog.url=${HEIDI_PLATFORM_WALLET_CATALOG_URL:${HEIDI_WALLET_CATALOG_URL:https://open-it.in/.well-known/web-components-config.json}}
heidi.platform.wallet-catalog.refresh-interval-ms=${HEIDI_PLATFORM_WALLET_CATALOG_REFRESH_INTERVAL_MS:${HEIDI_WALLET_CATALOG_REFRESH_INTERVAL_MS:21600000}}
heidi.platform.wallet-catalog.include-development=${HEIDI_PLATFORM_WALLET_CATALOG_INCLUDE_DEVELOPMENT:${HEIDI_WALLET_CATALOG_INCLUDE_DEVELOPMENT:false}}
heidi.platform.signing-provider.capability-refresh-interval-ms=${HEIDI_PLATFORM_SIGNING_PROVIDER_CAPABILITY_REFRESH_INTERVAL_MS:${HEIDI_SIGNING_PROVIDER_CAPABILITY_REFRESH_INTERVAL_MS:21600000}}
heidi.platform.signing-provider.capability-refresh-initial-delay-ms=${HEIDI_PLATFORM_SIGNING_PROVIDER_CAPABILITY_REFRESH_INITIAL_DELAY_MS:${HEIDI_SIGNING_PROVIDER_CAPABILITY_REFRESH_INITIAL_DELAY_MS:60000}}
heidi.platform.signing-provider.client-seed=${HEIDI_PLATFORM_SIGNING_PROVIDER_CLIENT_SEED:${HEIDI_PLATFORM_SIGNING_CLIENT_SEED:}}
heidi.platform.global-signing-provider.endpoint=${HEIDI_PLATFORM_GLOBAL_SIGNING_PROVIDER_ENDPOINT:}
heidi.platform.global-signing-provider.authentication-mode=${HEIDI_PLATFORM_GLOBAL_SIGNING_PROVIDER_AUTHENTICATION_MODE:${HEIDI_SIGNING_AUTH_MODE:none}}
heidi.platform.global-signing-provider.bearer-token=${HEIDI_PLATFORM_GLOBAL_SIGNING_PROVIDER_BEARER_TOKEN:${HEIDI_SIGNING_BEARER_TOKEN:}}
# Initial content language for new tenants; existing tenant settings are preserved.
heidi.platform.localization.default-language=${HEIDI_PLATFORM_LOCALIZATION_DEFAULT_LANGUAGE:${HEIDI_LOCALIZATION_DEFAULT_LANGUAGE:en}}

# Optional startup fixtures. The manifest contains tenantId, issuerSlug, and schema file lists.
heidi.schema-seed.enabled=${HEIDI_SCHEMA_SEED_ENABLED:false}
heidi.schema-seed.manifest=${HEIDI_SCHEMA_SEED_MANIFEST:}

spring.jpa.open-in-view=false

# Monitoring and Kubernetes probes. Keep the exposed actuator surface explicit;
# health details are intentionally not returned to unauthenticated callers.
management.server.port=${HEIDI_PLATFORM_MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

logging.config=classpath:logback-spring.xml
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/api-docs/swagger-ui
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.defaultModelsExpandDepth=2
springdoc.swagger-ui.syntaxHighlight.theme=arta

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.max-lifetime=600000
spring.flyway.locations=classpath:/db/migration/{vendor}

logbook.format.style=splunk
logbook.filter.form-request-mode=parameter
logbook.strategy=body-only-if-status-at-least
logbook.write.status-code-based=true
logbook.obfuscate.headers=Authorization,X-API-KEY,Content-Security-Policy,Set-Cookie,Permissions-Policy
logbook.obfuscate.parameters=access_token,client_secret,jwt_token,vp_token
logbook.obfuscate.json-body-fields=access_token,client_secret,jwt_token,vp_token,encryptedPayload,vpToken,privateJwk,privateKey,privateKeyPassword,bearerToken

heidi.platform.encryption-master-key=${HEIDI_PLATFORM_ENCRYPTION_MASTER_KEY}
heidi.platform.transaction-code-master-key=${HEIDI_PLATFORM_TRANSACTION_CODE_MASTER_KEY:${HEIDI_TRANSACTION_CODE_MASTER_KEY:${HEIDI_ENCRYPTION_MASTER_KEY}}}

heidi.platform.web-base-url=${HEIDI_PLATFORM_WEB_BASE_URL:${HEIDI_WEB_BASE_URL}}
heidi.platform.public-base-url=${HEIDI_PLATFORM_PUBLIC_BASE_URL}
heidi.issuer.public-base-url=${HEIDI_ISSUER_PUBLIC_BASE_URL}
heidi.verifier.public-base-url=${HEIDI_VERIFIER_PUBLIC_BASE_URL}
heidi.platform.issuer-internal-base-url=${HEIDI_PLATFORM_ISSUER_INTERNAL_BASE_URL:${HEIDI_ISSUER_BASE_URL}}
heidi.platform.verifier-internal-base-url=${HEIDI_PLATFORM_VERIFIER_INTERNAL_BASE_URL:${HEIDI_VERIFIER_INTERNAL_BASE_URL}}

heidi.platform.rp-registrar.base-url=${HEIDI_PLATFORM_RP_REGISTRAR_BASE_URL:${HEIDI_RELYING_PARTY_AUTH_BASE_URL}}
spring.security.oauth2.client.registration.rpregistrar.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.rpregistrar.client-id=${HEIDI_RP_REGISTRAR_CLIENT_ID}
spring.security.oauth2.client.registration.rpregistrar.client-secret=${HEIDI_RP_REGISTRAR_CLIENT_SECRET}
spring.security.oauth2.client.registration.rpregistrar.scope=openid
spring.security.oauth2.client.provider.rpregistrar.token-uri=${HEIDI_RP_REGISTRAR_TOKEN_URI}

heidi.platform.process-token-signing-key=${HEIDI_PLATFORM_PROCESS_TOKEN_SIGNING_KEY:${SIGNATURE_KEY}}
heidi.platform.server.api.basic-auth=${HEIDI_PLATFORM_SERVER_API_BASIC_AUTH:${HEIDI_SERVER_API_BASIC_AUTH}}

heidi.platform.rp-registrar.leaf-san=${HEIDI_PLATFORM_RP_REGISTRAR_LEAF_SAN:${ISSUANCE_LEAF_SAN:}}

heidi.platform.rp-registrar.registration.privacy-policy=${HEIDI_PLATFORM_RP_REGISTRAR_PRIVACY_POLICY:${HEIDI_RP_REGISTRAR_PRIVACY_POLICY:}}
heidi.platform.rp-registrar.registration.contact-email=${HEIDI_PLATFORM_RP_REGISTRAR_CONTACT_EMAIL:${HEIDI_RP_REGISTRAR_CONTACT_EMAIL:}}
heidi.platform.rp-registrar.registration.contact-website=${HEIDI_PLATFORM_RP_REGISTRAR_CONTACT_WEBSITE:${HEIDI_RP_REGISTRAR_CONTACT_WEBSITE:}}
heidi.platform.rp-registrar.registration.contact-phone=${HEIDI_PLATFORM_RP_REGISTRAR_CONTACT_PHONE:${HEIDI_RP_REGISTRAR_CONTACT_PHONE:}}
