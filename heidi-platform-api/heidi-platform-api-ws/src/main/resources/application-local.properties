# The local profile imports the repository's .env.local, which is a valid
# .properties file, so IDE run configurations and `just` share one definition of
# HEIDI_PUBLIC_HOST. The path is relative to this module's working directory and
# optional, so a run started from elsewhere still boots on the defaults below.
spring.config.import=optional:file:../../.env.local[.properties]

# Ports for this checkout's stack. Overriding them in .env.local moves the
# service and every URL below with it, so a second checkout can run its own.
server.port=${HEIDI_PLATFORM_PORT:8080}

# Points at the root compose.yaml so an IDE run can manage the databases itself
# by setting spring.docker.compose.enabled=true. The just recipes start them
# with `just dev-db` instead, so the integration stays off by default.
spring.docker.compose.file=../../compose.yaml
spring.docker.compose.enabled=false
spring.devtools.livereload.port=35731
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
logging.level.org.springdoc.core.events.SpringDocAppInitializer=ERROR
logbook.format.style=http
logbook.strategy=status-at-least
logbook.minimum-status=400
logbook.write.status-code-based=true

spring.datasource.url=jdbc:postgresql://localhost:${PLATFORM_POSTGRES_PORT:5432}/${PLATFORM_POSTGRES_DB:heidi_platform_api}
spring.datasource.username=${PLATFORM_POSTGRES_USER:heidi_platform_api}
spring.datasource.password=${PLATFORM_POSTGRES_PASSWORD:heidi_platform_api}

heidi.platform.encryption-master-key=4afa8db01ec9fa40a852332b0f6bcbf709c749e102d71d789af3876e72d925d2
heidi.platform.global-signing-provider.endpoint=${HEIDI_SIGNING_BASE_URL:http://127.0.0.1:${HEIDI_SIGNING_PORT:8086}}
heidi.platform.global-signing-provider.authentication-mode=${HEIDI_SIGNING_AUTH_MODE:none}
heidi.platform.signing-provider.client-seed=${HEIDI_PLATFORM_SIGNING_PROVIDER_CLIENT_SEED:${HEIDI_PLATFORM_SIGNING_CLIENT_SEED:}}
heidi.platform.transaction-code-master-key=${HEIDI_PLATFORM_TRANSACTION_CODE_MASTER_KEY:${HEIDI_TRANSACTION_CODE_MASTER_KEY:4afa8db01ec9fa40a852332b0f6bcbf709c749e102d71d789af3876e72d925d2}}

heidi.platform.web-base-url=${HEIDI_PLATFORM_WEB_BASE_URL:${HEIDI_WEB_BASE_URL:${HEIDI_PUBLIC_HOST:https://localhost}:${HEIDI_HTTPS_PORT:8443}}}
heidi.platform.public-base-url=${HEIDI_PLATFORM_PUBLIC_BASE_URL:${HEIDI_PUBLIC_HOST:https://localhost}:${HEIDI_HTTPS_PORT:8443}}
heidi.issuer.public-base-url=${HEIDI_ISSUER_PUBLIC_BASE_URL:${HEIDI_PUBLIC_HOST:https://localhost}:${HEIDI_HTTPS_PORT:8443}/issuance}
heidi.verifier.public-base-url=${HEIDI_VERIFIER_PUBLIC_BASE_URL:${HEIDI_PUBLIC_HOST:https://localhost}:${HEIDI_HTTPS_PORT:8443}/presentation}
heidi.platform.issuer-internal-base-url=${HEIDI_PLATFORM_ISSUER_INTERNAL_BASE_URL:${HEIDI_ISSUER_BASE_URL:http://127.0.0.1:${HEIDI_ISSUER_PORT:8082}}}
heidi.platform.verifier-internal-base-url=${HEIDI_PLATFORM_VERIFIER_INTERNAL_BASE_URL:${HEIDI_VERIFIER_INTERNAL_BASE_URL:http://127.0.0.1:${HEIDI_VERIFIER_PORT:8083}}}
heidi.platform.rp-registrar.base-url=${HEIDI_PLATFORM_RP_REGISTRAR_BASE_URL:https://registrar.example.invalid}

# Reconstruct the public HTTPS request behind the local Caddy proxy. Without
# this, Spring treats same-origin browser requests as HTTP-to-HTTPS CORS.
server.forward-headers-strategy=framework

spring.security.oauth2.client.provider.rpregistrar.token-uri=${HEIDI_RP_REGISTRAR_TOKEN_URI:https://registrar.example.invalid/oauth/token}

# Everything below is a checked-in development value: keys, passwords and a
# certificate that exist so a fresh clone starts without setup. They are public by
# definition and must never be reused by a deployment, which supplies its own
# through the environment variables in application.properties.
heidi.platform.process-token-signing-key=h4ck35
heidi.platform.server.api.basic-auth=YXBpOjEyMzQ1

heidi.platform.rp-registrar.leaf-san=localhost

# Mints a throw-away CA under .local/ and seeds the local issuer with it, so credentials issued
# here verify here. Set only in this file: the code also requires the `local` profile, so a
# deployment cannot generate a CA by accident. Never set this outside local development.
heidi.platform.dev.generate-ca=true


heidi.platform.local.tenant-id=acme
heidi.platform.local.tenant-display-name=Acme
heidi.platform.local.user-id=acme-admin
heidi.platform.local.username=klara@acme.example
heidi.platform.local.display-name=Klara Admin
heidi.platform.local.issuer-slug=acme
heidi.platform.local.issuer-display-name=Acme Digital Identity
heidi.platform.local.trust-systems=${HEIDI_PLATFORM_LOCAL_TRUST_SYSTEMS:Custom,EUDI}

# Keep a usable credential and proof schema in every local database reset. The
# conformance runner overrides both values when it needs a different manifest.
heidi.schema-seed.enabled=${HEIDI_SCHEMA_SEED_ENABLED:true}
heidi.schema-seed.manifest=${HEIDI_SCHEMA_SEED_MANIFEST:tools/local-dev/schema-seed.json}
# Deployments without an identity provider run as a single user who may do
# everything; roles are enforced, but this user holds all of them.
heidi.platform.local.roles=SUPER_ADMIN,ADMIN,MANAGER,EDITOR,OPERATOR,DEVELOPER
