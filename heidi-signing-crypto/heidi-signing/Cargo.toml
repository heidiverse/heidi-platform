[package]
name = "heidi-signing"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
uniffi = { version = "=0.28.3" }
kapun-x509 = { git = "https://github.com/KapunSDK/kapun-sdk.git" }
josekit = { git = "https://github.com/heidiverse/josekit-rs.git", default-features = false, features = [
    "rustcrypto",
    "pqc"
], branch = "feature/digest-signing" }
ed25519-dalek = { version = "3.0.0", features = [
    "rand_core",
    "digest",
]}
hmac = "0.13.0"
sha2 = "0.11.0"

[dev-dependencies]
base64 = "0.23.1"
