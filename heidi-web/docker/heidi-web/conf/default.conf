server {
  listen 80;

  server_name web;

  root /var/www/web;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  
  gzip_types
    application/javascript
    application/json
    application/xml
    font/ttf
    font/woff
    font/woff2
    image/svg+xml
    text/css
    text/html
    text/javascript
    text/plain
    text/xml;

  location /api-docs {
    try_files $uri $uri/ /api-docs.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
  }

  location = /config.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
  }
}
